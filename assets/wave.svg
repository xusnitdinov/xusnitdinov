<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 80" preserveAspectRatio="none" role="img" aria-label="animated wave">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.15">
        <animate attributeName="stop-opacity" values="0.15;0.45;0.15" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#0ea5a0" stop-opacity="0.55">
        <animate attributeName="stop-opacity" values="0.55;0.9;0.55" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0.15">
        <animate attributeName="stop-opacity" values="0.15;0.45;0.15" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>
  <path fill="url(#g)" d="M0,40 C150,70 350,10 600,40 C850,70 1050,10 1200,40 L1200,80 L0,80 Z">
    <animate attributeName="d"
      dur="6s"
      repeatCount="indefinite"
      values="
        M0,40 C150,70 350,10 600,40 C850,70 1050,10 1200,40 L1200,80 L0,80 Z;
        M0,40 C150,10 350,70 600,40 C850,10 1050,70 1200,40 L1200,80 L0,80 Z;
        M0,40 C150,70 350,10 600,40 C850,70 1050,10 1200,40 L1200,80 L0,80 Z"/>
  </path>
  <path fill="none" stroke="#0d9488" stroke-width="2" stroke-opacity="0.55"
    d="M0,36 C200,10 400,62 600,36 C800,10 1000,62 1200,36">
    <animate attributeName="d"
      dur="5s"
      repeatCount="indefinite"
      values="
        M0,36 C200,10 400,62 600,36 C800,10 1000,62 1200,36;
        M0,36 C200,62 400,10 600,36 C800,62 1000,10 1200,36;
        M0,36 C200,10 400,62 600,36 C800,10 1000,62 1200,36"/>
  </path>
</svg>
